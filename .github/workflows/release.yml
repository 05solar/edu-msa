name: Release Images

# 이미지 수명주기: build → 불변 태그(git-<sha> + 태그 push 시 semver) → GHCR push →
# 배포 반영은 bootstrap.sh 가 IMAGE_TAG 로 매니페스트에 주입한다(:latest 미사용).
# 롤백 = 이전 태그로 재배포(IMAGE_TAG=git-<이전sha>) 또는 kubectl rollout undo.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: ${{ matrix.svc }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        svc: [backend, auth-service, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata (불변 태그)
        id: meta
        run: |
          echo "base=ghcr.io/${GITHUB_REPOSITORY,,}/edu-msa-${{ matrix.svc }}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=git-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (git-<sha>)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.svc }}
          push: true
          tags: ${{ steps.meta.outputs.base }}:${{ steps.meta.outputs.sha_tag }}

      # 릴리스 태그(v*) push 시 같은 이미지에 semver 태그를 함께 부여한다
      - name: Tag semver (release only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker buildx imagetools create \
            -t "${{ steps.meta.outputs.base }}:${GITHUB_REF_NAME#v}" \
            "${{ steps.meta.outputs.base }}:${{ steps.meta.outputs.sha_tag }}"

      - name: Deploy hint
        run: |
          {
            echo "### ${{ matrix.svc }} 이미지 push 완료"
            echo '```'
            echo "image: ${{ steps.meta.outputs.base }}:${{ steps.meta.outputs.sha_tag }}"
            echo "# 내부 클러스터 배포(레지스트리 미러링 후):"
            echo "MODE=server DOMAIN=<도메인> REGISTRY=<내부 레지스트리> IMAGE_TAG=${{ steps.meta.outputs.sha_tag }} ./deploy/bootstrap.sh core"
            echo "# 롤백: IMAGE_TAG=git-<이전sha> 로 재실행 또는 kubectl -n edu-platform rollout undo deploy/<name>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
