spring:
  application:
    name: edu-auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5433/eduauth}
    username: ${AUTH_DB_USER:eduauth}
    password: ${AUTH_DB_PASSWORD:eduauth}
    hikari:
      # 커넥션 풀 — 명시적 기본값(보수적). 최종값은 부하 테스트로 확정한다.
      # 로그인은 bcrypt(CPU)로 커넥션 점유가 길어질 수 있어 replica 확장과 함께 산정할 것.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT_MS:5000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
  # 스키마는 Flyway 마이그레이션(db/migration)으로만 변경한다.
  # 기존 ddl-auto:update 로 만들어진 DB 는 baseline-on-migrate 가 V1 을 건너뛴다(스키마 동일).
  flyway:
    enabled: ${EDU_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: "1"
  jpa:
    hibernate:
      # 운영 기본 validate — 스키마 변경은 Flyway 로만. (개발 편의로 재정의 가능)
      ddl-auto: ${EDU_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  lifecycle:
    timeout-per-shutdown-phase: ${EDU_SHUTDOWN_TIMEOUT:20s}

server:
  port: ${PORT:8080}        # 플랫폼 표준: PORT 환경변수로 listen
  # SIGTERM 수신 시 신규 요청은 거부하고 진행 중 요청을 마친 뒤 종료
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:200}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:10}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info

edu:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    # 시크릿은 소스에 두지 않는다. 컨테이너/K8s Secret 으로 EDU_JWT_SECRET 을 주입한다.
    secret: ${EDU_JWT_SECRET:}
    issuer: ${EDU_JWT_ISSUER:edu-auth-service}
    access-ttl-seconds: ${EDU_JWT_ACCESS_TTL:1800}        # 30분
    refresh-ttl-seconds: ${EDU_JWT_REFRESH_TTL:1209600}   # 14일
    # 시연용 세션은 짧게 — 데모 진입 후에도 로그인 화면을 다시 확인할 수 있도록
    demo-refresh-ttl-seconds: ${EDU_JWT_DEMO_REFRESH_TTL:86400}   # 1일
  auth:
    ratelimit:
      # 로그인/갱신 남용 방어. 값은 운영 데이터 기준으로 조정한다.
      enabled: ${EDU_RATELIMIT_ENABLED:true}
      # 같은 계정: 10분 창에서 5회 초과 실패 → 5분 임시 차단 (모든 IP 공통)
      account-max-failures: ${EDU_RATELIMIT_ACCOUNT_MAX:5}
      account-window-seconds: ${EDU_RATELIMIT_ACCOUNT_WINDOW:600}
      account-block-seconds: ${EDU_RATELIMIT_ACCOUNT_BLOCK:300}
      # 같은 IP(계정 무관 합산): 10분 창 30회 초과 실패 → 10분 차단 (NAT 고려해 관대)
      ip-max-failures: ${EDU_RATELIMIT_IP_MAX:30}
      ip-window-seconds: ${EDU_RATELIMIT_IP_WINDOW:600}
      ip-block-seconds: ${EDU_RATELIMIT_IP_BLOCK:600}
      # 실패 응답 지연(지수 백오프): 300ms × 2^(n-1), 상한 2초
      fail-delay-ms: ${EDU_RATELIMIT_FAIL_DELAY_MS:300}
      max-fail-delay-ms: ${EDU_RATELIMIT_MAX_FAIL_DELAY_MS:2000}
      # refresh 남용(위조·만료 토큰 반복 제출): IP 기준 60초 창 30회 → 5분 차단
      refresh-max-failures: ${EDU_RATELIMIT_REFRESH_MAX:30}
      refresh-window-seconds: ${EDU_RATELIMIT_REFRESH_WINDOW:60}
      refresh-block-seconds: ${EDU_RATELIMIT_REFRESH_BLOCK:300}
    cleanup:
      # 만료 refresh token 정리 — 만료 후 retention 이 지난 행만 배치 삭제.
      # (폐기됐지만 만료 전인 행은 탈취 감지용으로 만료까지 보존)
      enabled: ${EDU_CLEANUP_ENABLED:true}
      interval-ms: ${EDU_CLEANUP_INTERVAL_MS:3600000}       # 1시간
      initial-delay-ms: ${EDU_CLEANUP_INITIAL_DELAY_MS:60000}
      retention-hours: ${EDU_CLEANUP_RETENTION_HOURS:24}
      batch-size: ${EDU_CLEANUP_BATCH_SIZE:10000}
    demo:
      # 시연용 데모 로그인 — fail-safe 기본 false. 개발/시연 환경에서만 명시적으로 켠다.
      enabled: ${EDU_DEMO_LOGIN:false}
      accounts:
        user: ${EDU_DEMO_USER:yunhaneul}
        coder: ${EDU_DEMO_CODER:kimdohyun}
        admin: ${EDU_DEMO_ADMIN:jungwooseong}
    cookie:
      # 로컬 http 개발에서는 false, HTTPS 배포에서는 true 로 주입한다.
      secure: ${EDU_COOKIE_SECURE:false}
      same-site: ${EDU_COOKIE_SAMESITE:Lax}
  seed:
    enabled: ${EDU_SEED:true}
    # 데모 계정 7명의 공통 임시 비밀번호. 운영에서는 반드시 재정의한다.
    password: ${EDU_SEED_PASSWORD:Edu@2026!}
