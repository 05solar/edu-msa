spring:
  datasource:
    url: jdbc:h2:mem:authdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  # 일반 테스트는 H2 create-drop 으로 빠르게 돈다.
  # 마이그레이션 검증은 SchemaMigrationTest 가 Flyway+validate 조합으로 별도 수행한다.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

edu:
  jwt:
    secret: test-secret-key-for-edu-auth-service-only-32bytes+
  seed:
    enabled: false
