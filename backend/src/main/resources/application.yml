spring:
  application:
    name: edu-msa-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edumsa}
    username: ${DB_USER:edumsa}
    password: ${DB_PASSWORD:edumsa}
    hikari:
      # 커넥션 풀 — 명시적 기본값(보수적). 최종값은 부하 테스트로 확정한다.
      # replica 수 × maximum-pool-size 가 Postgres max_connections 를 넘지 않게 산정할 것.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT_MS:5000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
  # 스키마는 Flyway 마이그레이션(db/migration)으로만 변경한다.
  # 기존 ddl-auto:update 로 만들어진 DB 는 baseline-on-migrate 가 V1 을 건너뛴다(스키마 동일).
  flyway:
    enabled: ${EDU_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: "1"
    # 공통 + 벤더별({vendor}=postgresql|h2) 분리 — V3(부분 유니크 인덱스·DO 블록)는
    # PostgreSQL 전용 문법이라 H2(테스트)용 동판을 별도로 둔다.
    # 주의: 벤더 디렉터리는 db/migration "밖"에 둔다 — classpath 스캔이 재귀라
    # 하위에 두면 같은 버전이 중복 발견돼 Flyway 가 기동을 거부한다.
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  jpa:
    hibernate:
      # 운영 기본 validate — 스키마 변경은 Flyway 로만. (개발 편의로 재정의 가능)
      ddl-auto: ${EDU_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        # LAZY 컬렉션(tags/tech/purposes/run 등)을 IN 배치로 묶어 로드 — 목록 N+1 제거.
        # 페이지 N건 조회 시 컬렉션 종류당 쿼리 1개(총 4개)로 고정된다.
        default_batch_fetch_size: 100
  # 공개 카탈로그 읽기 캐시 — Redis. 장애 시 DB 폴백(LenientCacheErrorHandler)이라 필수 의존이 아니다.
  cache:
    type: ${EDU_CACHE_TYPE:redis}       # 테스트: none / 캐시 없이 돌리려면 none
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Redis 장애 시 요청당 이 시간 × 연산 수만큼 지연이 누적된다 — staging 장애 드릴 실측:
      # 2s 설정에서 카탈로그 +4s(연산 2회)였다. 정상 연산은 1ms 미만이라 짧게 둬도 안전.
      timeout: ${REDIS_TIMEOUT:250ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
  lifecycle:
    # graceful shutdown 시 진행 중 요청을 기다리는 최대 시간
    timeout-per-shutdown-phase: ${EDU_SHUTDOWN_TIMEOUT:20s}

server:
  port: ${PORT:8080}        # 플랫폼 표준: PORT 환경변수로 listen
  # SIGTERM 수신 시 신규 요청은 거부하고 진행 중 요청을 마친 뒤 종료(롤링 업데이트·스케일 인 무중단)
  shutdown: graceful
  tomcat:
    # 요청 처리 용량 — 명시적 기본값(톰캣 기본과 동일 수준). 최종값은 부하 테스트로 확정한다.
    threads:
      max: ${TOMCAT_THREADS_MAX:200}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:10}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # Prometheus 스크레이프용 메트릭 엔드포인트
  metrics:
    tags:
      application: edu-msa-backend        # 모든 메트릭에 애플리케이션 라벨 부여
  prometheus:
    metrics:
      export:
        enabled: true

edu:
  seed: ${EDU_SEED:true}    # 최초 실행 시 목업 데이터 시드 여부
  notification:
    # 보존 정책(P2-1): "읽은" 알림만 retention 경과 후 배치 삭제(미읽음은 자동 삭제 없음)
    retention-days: ${EDU_NOTI_RETENTION_DAYS:90}
    cleanup-enabled: ${EDU_NOTI_CLEANUP_ENABLED:true}
    cleanup-batch-size: ${EDU_NOTI_CLEANUP_BATCH:500}
    cleanup-interval-ms: ${EDU_NOTI_CLEANUP_INTERVAL_MS:3600000}
  datasource:
    # read replica 라우팅(선택) — 설정 시 replica 마킹된 readOnly 조회(카탈로그 목록/집계)가
    # 이 URL(K8s: edu-db-pooler-ro)로 간다. 미설정이면 라우팅 자체가 꺼진다(단일 datasource).
    read-url: ${DB_RO_URL:}
    read-pool-max-size: ${DB_RO_POOL_MAX_SIZE:10}
  cache:
    # 카탈로그 캐시 TTL — 변경 지점의 즉시 무효화(CatalogCacheEvictor)와 이중 안전장치
    list-ttl-seconds: ${EDU_CACHE_LIST_TTL:30}
    counts-ttl-seconds: ${EDU_CACHE_COUNTS_TTL:60}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    # 인증은 auth-service 가 담당하고 여기서는 검증만 한다.
    # auth-service 와 반드시 동일한 값을 주입해야 한다(소스에 두지 않는다).
    secret: ${EDU_JWT_SECRET:}
    issuer: ${EDU_JWT_ISSUER:edu-auth-service}
  deploy:
    mode: ${EDU_DEPLOY_MODE:simulate}          # simulate | real(kubectl/docker 실행)
    namespace: ${EDU_DEPLOY_NAMESPACE:edu-services}              # 내부(반신뢰)
    namespace-public: ${EDU_DEPLOY_NAMESPACE_PUBLIC:edu-services-public}  # 외부(비신뢰)
    ingress-host: ${EDU_DEPLOY_INGRESS_HOST:edu.internal}
    registry: ${EDU_DEPLOY_REGISTRY:registry.edu.internal}
    # Kaniko 빌드 실행 ns — 미신뢰 Dockerfile 격리 전용(deploy/k8s/platform/build.yaml).
    # 플랫폼 네임스페이스(edu-platform)를 지정하면 안 된다.
    build-namespace: ${EDU_DEPLOY_BUILD_NAMESPACE:edu-build}
    kaniko-insecure: ${EDU_DEPLOY_KANIKO_INSECURE:false}          # HTTP 레지스트리(kind 등)면 true
    build-cpu-limit: ${EDU_DEPLOY_BUILD_CPU_LIMIT:1}              # 빌드 Job 상한(LimitRange max 이내)
    build-memory-limit: ${EDU_DEPLOY_BUILD_MEMORY_LIMIT:2Gi}
    replicas: ${EDU_DEPLOY_REPLICAS:1}
    cpu-limit: ${EDU_DEPLOY_CPU_LIMIT:500m}
    memory-limit: ${EDU_DEPLOY_MEMORY_LIMIT:512Mi}
    host-port-base: ${EDU_DEPLOY_HOST_PORT_BASE:31000}
    app-host: ${EDU_DEPLOY_APP_HOST:localhost}
    auto-on-approve: ${EDU_DEPLOY_AUTO_ON_APPROVE:true}   # 승인 시 자동 배포
    # 내부 Gitea 연동(비공개 레포 clone 자격 증명) — 호스트 미설정 시 미주입(공개 레포만)
    gitea-host: ${EDU_GITEA_HOST:}                        # 예: gitea.edu.internal
    gitea-user: ${EDU_GITEA_USER:edu-deploy-bot}
    gitea-token: ${EDU_GITEA_TOKEN:}
    # clone 실제 접근 주소(내부용, 선택) — 예: http://gitea-http.gitea.svc:3000
    gitea-clone-base: ${EDU_GITEA_CLONE_BASE:}
    # push webhook 서명 검증 시크릿 — 미설정 시 /api/webhooks/gitea 비활성(404)
    gitea-webhook-secret: ${EDU_GITEA_WEBHOOK_SECRET:}
    worker:
      enabled: ${EDU_DEPLOY_WORKER_ENABLED:true}          # 배포 작업 큐 워커
      poll-ms: ${EDU_DEPLOY_WORKER_POLL_MS:3000}
