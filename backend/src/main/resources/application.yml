spring:
  application:
    name: edu-msa-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edumsa}
    username: ${DB_USER:edumsa}
    password: ${DB_PASSWORD:edumsa}
  jpa:
    hibernate:
      ddl-auto: update      # Phase 2 편의용. Phase 3에서 Flyway 마이그레이션으로 전환.
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}        # 플랫폼 표준: PORT 환경변수로 listen

management:
  endpoints:
    web:
      exposure:
        include: health,info

edu:
  seed: ${EDU_SEED:true}    # 최초 실행 시 목업 데이터 시드 여부
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    # 인증은 auth-service 가 담당하고 여기서는 검증만 한다.
    # auth-service 와 반드시 동일한 값을 주입해야 한다(소스에 두지 않는다).
    secret: ${EDU_JWT_SECRET:}
    issuer: ${EDU_JWT_ISSUER:edu-auth-service}
  deploy:
    mode: ${EDU_DEPLOY_MODE:simulate}          # simulate | real(kubectl/docker 실행)
    namespace: ${EDU_DEPLOY_NAMESPACE:edu-services}
    ingress-host: ${EDU_DEPLOY_INGRESS_HOST:edu.internal}
    registry: ${EDU_DEPLOY_REGISTRY:registry.edu.internal}
    replicas: ${EDU_DEPLOY_REPLICAS:1}
    cpu-limit: ${EDU_DEPLOY_CPU_LIMIT:500m}
    memory-limit: ${EDU_DEPLOY_MEMORY_LIMIT:512Mi}
    host-port-base: ${EDU_DEPLOY_HOST_PORT_BASE:31000}
    app-host: ${EDU_DEPLOY_APP_HOST:localhost}
    auto-on-approve: ${EDU_DEPLOY_AUTO_ON_APPROVE:true}   # 승인 시 자동 배포
