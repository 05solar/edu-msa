spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  # 일반 테스트는 H2 create-drop 으로 빠르게 돈다.
  # 마이그레이션 검증은 SchemaMigrationTest 가 Flyway+validate 조합으로 별도 수행한다.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        generate_statistics: true   # N+1 검증용 쿼리 수 계측

edu:
  seed: false
  cors:
    allowed-origins: http://localhost:5173
  deploy:
    worker:
      enabled: false   # 테스트에서는 배포 워커 비활성(H2)
  jwt:
    secret: test-secret-key-for-edu-msa-backend-only-32bytes+
    issuer: edu-auth-service
