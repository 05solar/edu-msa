name: edu-msa

# 민감한 값은 하드코딩하지 않고 환경변수로 주입한다.
# 로컬 실행 시 deploy/.env 를 두거나 셸에서 export 하면 된다. (deploy/.env.example 참고)
#   EDU_JWT_SECRET     auth-service 가 발급하고 backend 가 검증하는 공용 서명 키 (32바이트 이상)
#   EDU_SEED_PASSWORD  데모 계정 7명의 공통 임시 비밀번호

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edumsa
      POSTGRES_USER: edumsa
      POSTGRES_PASSWORD: ${DB_PASSWORD:-edumsa}
    ports:
      - "5432:5432"
    volumes:
      - edu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edumsa -d edumsa"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 인증 전용 DB — 플랫폼 DB 와 분리한다. 계정 정보의 단일 소스.
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eduauth
      POSTGRES_USER: eduauth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-eduauth}
    ports:
      - "5433:5432"
    volumes:
      - edu_auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduauth -d eduauth"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 인증 마이크로서비스 — 회원가입·로그인·JWT 발급. 각 서비스는 동일 시크릿으로 토큰을 자체 검증.
  auth-service:
    build:
      context: ../auth-service
    environment:
      AUTH_DB_URL: jdbc:postgresql://auth-db:5432/eduauth
      AUTH_DB_USER: eduauth
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-eduauth}
      PORT: "8080"
      CORS_ORIGINS: http://localhost:5173
      EDU_JWT_SECRET: ${EDU_JWT_SECRET:?EDU_JWT_SECRET 을 설정하세요 (32바이트 이상)}
      # 로컬은 http 이므로 Secure 쿠키를 끈다. HTTPS 배포에서는 true + SameSite=None.
      EDU_COOKIE_SECURE: "false"
      EDU_COOKIE_SAMESITE: Lax
      EDU_SEED: "true"
      EDU_SEED_PASSWORD: ${EDU_SEED_PASSWORD:-Edu@2026!}
    ports:
      - "8089:8080"
    depends_on:
      auth-db:
        condition: service_healthy

  # 서브도메인 리버스 프록시: <slug>.localhost -> 해당 서비스 컨테이너로 Host 라우팅.
  # 백엔드가 배포 시 /dynamic/<slug>.yml 라우트 파일을 써 넣고 Traefik 파일 프로바이더가 감시한다.
  # (Docker Desktop 소켓 프로바이더 이슈 회피 · 컨테이너명은 eduproxy 네트워크 DNS로 해소)
  traefik:
    image: traefik:v3.1
    command:
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "80:80"
      - "8091:8080"
    volumes:
      - edu_dynamic:/dynamic
    networks:
      - eduproxy
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    # 로컬 Docker 실배포 모드에서 호스트 docker.sock 접근을 위해 root 실행(개발용)
    user: root
    environment:
      DB_URL: jdbc:postgresql://db:5432/edumsa
      DB_USER: edumsa
      DB_PASSWORD: ${DB_PASSWORD:-edumsa}
      PORT: "8080"
      CORS_ORIGINS: http://localhost:5173
      EDU_SEED: "true"
      # auth-service 와 반드시 동일한 시크릿 — 각 서비스가 JWT 를 자체 검증한다.
      EDU_JWT_SECRET: ${EDU_JWT_SECRET:?EDU_JWT_SECRET 을 설정하세요 (32바이트 이상)}
      # simulate(기본) | docker(로컬 실배포, 호스트 docker로 컨테이너 기동) | real(K8s)
      EDU_DEPLOY_MODE: ${EDU_DEPLOY_MODE:-docker}
      EDU_DEPLOY_APP_HOST: localhost
      # 배포 서비스 접속용 서브도메인 베이스: url = http://<slug>.<base>
      EDU_DEPLOY_SUBDOMAIN_BASE: localhost
      # 배포 컨테이너가 합류할 프록시 네트워크(Traefik과 동일)
      EDU_DEPLOY_PROXY_NETWORK: eduproxy
      # Traefik 파일 프로바이더 라우트 파일을 써 넣을 경로(공유 볼륨)
      EDU_DEPLOY_DYNAMIC_DIR: /dynamic
    ports:
      - "8088:8080"
    volumes:
      # docker 모드: 호스트 도커 데몬 사용 + 예제 소스(local:// 시험용) 마운트
      - /var/run/docker.sock:/var/run/docker.sock
      - ../examples:/app/examples:ro
      # Traefik 동적 라우트 파일 공유(백엔드 write, traefik watch)
      - edu_dynamic:/dynamic
    networks:
      - default
      - eduproxy
    depends_on:
      db:
        condition: service_healthy

volumes:
  edu_pgdata:
  edu_auth_pgdata:
  edu_dynamic:

networks:
  eduproxy:
    name: eduproxy
