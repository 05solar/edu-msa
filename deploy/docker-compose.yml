name: edu-msa

# 민감한 값은 하드코딩하지 않고 환경변수로 주입한다.
# 로컬 실행 시 deploy/.env 를 두거나 셸에서 export 하면 된다. (deploy/.env.example 참고)
#   EDU_JWT_SECRET     auth-service 가 발급하고 backend 가 검증하는 공용 서명 키 (32바이트 이상)
#   EDU_SEED_PASSWORD  데모 계정 7명의 공통 임시 비밀번호

services:
  db:
    image: mariadb:11.4
    # utf8mb4(한글) + UTC 고정 — 앱(Instant)과 커넥터(timezone=UTC)의 기준 시계와 일치시킨다.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: edumsa
      MARIADB_USER: edumsa
      MARIADB_PASSWORD: ${DB_PASSWORD:-edumsa}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-edumsa-root}
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - edu_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 인증 전용 DB — 플랫폼 DB 와 분리한다. 계정 정보의 단일 소스.
  auth-db:
    image: mariadb:11.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: eduauth
      MARIADB_USER: eduauth
      MARIADB_PASSWORD: ${AUTH_DB_PASSWORD:-eduauth}
      MARIADB_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD:-eduauth-root}
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - edu_auth_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Redis — 카탈로그 캐시(backend) + rate-limit 분산 카운터(auth-service). 개발용 단일 인스턴스.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-eduredis}",
              "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-eduredis} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 인증 마이크로서비스 — 회원가입·로그인·JWT 발급. 각 서비스는 동일 시크릿으로 토큰을 자체 검증.
  auth-service:
    build:
      context: ../auth-service
    environment:
      AUTH_DB_URL: jdbc:mariadb://auth-db:3306/eduauth?timezone=UTC
      AUTH_DB_USER: eduauth
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-eduauth}
      PORT: "8080"
      CORS_ORIGINS: http://localhost:5173
      EDU_JWT_SECRET: ${EDU_JWT_SECRET:?EDU_JWT_SECRET 을 설정하세요 (32바이트 이상)}
      # 로컬은 http 이므로 Secure 쿠키를 끈다. HTTPS 배포에서는 true + SameSite=None.
      EDU_COOKIE_SECURE: "false"
      EDU_COOKIE_SAMESITE: Lax
      EDU_SEED: "true"
      EDU_SEED_PASSWORD: ${EDU_SEED_PASSWORD:-Edu@2026!}
      # 데모 로그인은 앱 기본값이 false(fail-safe) — 로컬 개발/시연이므로 명시적으로 켠다.
      EDU_DEMO_LOGIN: "true"
      # rate-limit 분산 카운터 — 개발에서도 redis 경로를 실사용해 검증한다.
      EDU_RATELIMIT_STORE: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-eduredis}
    ports:
      - "8089:8080"
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 서브도메인 리버스 프록시: <slug>.localhost -> 해당 서비스 컨테이너로 Host 라우팅.
  # 백엔드가 배포 시 /dynamic/<slug>.yml 라우트 파일을 써 넣고 Traefik 파일 프로바이더가 감시한다.
  # (Docker Desktop 소켓 프로바이더 이슈 회피 · 컨테이너명은 eduproxy 네트워크 DNS로 해소)
  traefik:
    image: traefik:v3.1
    command:
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "80:80"
      - "8091:8080"
    volumes:
      - edu_dynamic:/dynamic
    networks:
      - eduproxy
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    # 로컬 Docker 실배포 모드에서 호스트 docker.sock 접근을 위해 root 실행(개발용)
    user: root
    environment:
      DB_URL: jdbc:mariadb://db:3306/edumsa?timezone=UTC
      DB_USER: edumsa
      DB_PASSWORD: ${DB_PASSWORD:-edumsa}
      PORT: "8080"
      CORS_ORIGINS: http://localhost:5173
      EDU_SEED: "true"
      # auth-service 와 반드시 동일한 시크릿 — 각 서비스가 JWT 를 자체 검증한다.
      EDU_JWT_SECRET: ${EDU_JWT_SECRET:?EDU_JWT_SECRET 을 설정하세요 (32바이트 이상)}
      # simulate(기본) | docker(로컬 실배포, 호스트 docker로 컨테이너 기동) | real(K8s)
      EDU_DEPLOY_MODE: ${EDU_DEPLOY_MODE:-docker}
      EDU_DEPLOY_APP_HOST: localhost
      # 배포 서비스 접속용 서브도메인 베이스: url = http://<slug>.<base>
      EDU_DEPLOY_SUBDOMAIN_BASE: localhost
      # 배포 컨테이너가 합류할 프록시 네트워크(Traefik과 동일)
      EDU_DEPLOY_PROXY_NETWORK: eduproxy
      # Traefik 파일 프로바이더 라우트 파일을 써 넣을 경로(공유 볼륨)
      EDU_DEPLOY_DYNAMIC_DIR: /dynamic
      # 내부 Gitea 연동(비공개 레포 clone) — 미설정 시 기존 동작(공개 레포만)
      EDU_GITEA_HOST: ${EDU_GITEA_HOST:-}
      EDU_GITEA_USER: ${EDU_GITEA_USER:-edu-deploy-bot}
      EDU_GITEA_TOKEN: ${EDU_GITEA_TOKEN:-}
      # clone 실제 접근 주소 — git/curl 이 *.localhost 를 루프백으로 강제 해석하므로
      # 로컬 개발은 직접 주소를 쓴다(예: kubectl port-forward 후 http://host.docker.internal:3000)
      EDU_GITEA_CLONE_BASE: ${EDU_GITEA_CLONE_BASE:-}
      # push webhook 서명 검증 시크릿 — 미설정 시 webhook 엔드포인트 비활성(404)
      EDU_GITEA_WEBHOOK_SECRET: ${EDU_GITEA_WEBHOOK_SECRET:-}
      # Gitea 계정 셀프 발급용 관리자 토큰(write:admin) — 미설정 시 발급 기능 비활성
      EDU_GITEA_ADMIN_TOKEN: ${EDU_GITEA_ADMIN_TOKEN:-}
      # 카탈로그 읽기 캐시(Redis) — 장애 시 DB 폴백
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-eduredis}
    ports:
      - "8088:8080"
    volumes:
      # docker 모드: 호스트 도커 데몬 사용 + 예제 소스(local:// 시험용) 마운트
      - /var/run/docker.sock:/var/run/docker.sock
      - ../examples:/app/examples:ro
      # Traefik 동적 라우트 파일 공유(백엔드 write, traefik watch)
      - edu_dynamic:/dynamic
    networks:
      - default
      - eduproxy
    depends_on:
      db:
        condition: service_healthy

volumes:
  # MariaDB 전환으로 볼륨을 신규로 판다(edu_pgdata 등 기존 PostgreSQL 볼륨을 재사용하면
  # mariadb 가 낯선 datadir 로 인식해 기동 실패한다). 기존 데이터 이관은
  # docs/operations/MARIADB_MIGRATION_RUNBOOK.md 참고.
  edu_mariadb:
  edu_auth_mariadb:
  edu_dynamic:

networks:
  eduproxy:
    name: eduproxy
