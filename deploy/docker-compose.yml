name: edu-msa

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edumsa
      POSTGRES_USER: edumsa
      POSTGRES_PASSWORD: edumsa
    ports:
      - "5432:5432"
    volumes:
      - edu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edumsa -d edumsa"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/edumsa
      DB_USER: edumsa
      DB_PASSWORD: edumsa
      PORT: "8080"
      CORS_ORIGINS: http://localhost:5173
      EDU_SEED: "true"
    ports:
      - "8088:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  edu_pgdata:
