# 인증 전용 PostgreSQL — 개발/리허설용 단일 인스턴스.
# 운영은 auth-db-ha.yaml(CloudNativePG: HA·풀러·백업·PITR)로 승격한다 — PRODUCTION.md §4.
# 플랫폼 DB(platform/postgres.yaml)와 완전히 분리된 인스턴스다.
#
# 접속정보는 소스에 두지 않는다. 아래 Secret 은 형태를 보여주는 자리표시자이므로
# 실제 환경에서는 apply 전에 값을 교체하거나 별도로 생성한다.
#   kubectl -n edu-platform create secret generic edu-auth-db \
#     --from-literal=POSTGRES_DB=eduauth \
#     --from-literal=POSTGRES_USER=eduauth \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)"
apiVersion: v1
kind: Secret
metadata:
  name: edu-auth-db
  namespace: edu-platform
type: Opaque
stringData:
  POSTGRES_DB: eduauth
  POSTGRES_USER: eduauth
  POSTGRES_PASSWORD: change-me-in-real-env
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edu-auth-pgdata
  namespace: edu-platform
spec:
  # 운영: 노드 종속 스토리지(local-path 등) 금지 — 네트워크 스토리지 클래스를 지정해야
  # 노드 장애/드레인 시 파드가 다른 노드로 재스케줄될 수 있다.
  # bootstrap.sh 가 STORAGE_CLASS 설정 시 아래 마커를 실제 값으로 치환한다(미설정 시 클러스터 기본).
  #EDU_STORAGE_CLASS
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-db
  namespace: edu-platform
  labels:
    app: auth-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-db
  template:
    metadata:
      labels:
        app: auth-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: edu-auth-db
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "eduauth", "-d", "eduauth"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: edu-auth-pgdata
---
apiVersion: v1
kind: Service
metadata:
  name: auth-db
  namespace: edu-platform
spec:
  selector:
    app: auth-db
  ports:
    - port: 5432
      targetPort: 5432
