# 인증 마이크로서비스.
#
# JWT 서명 키는 auth-service(발급)와 backend(검증)가 같은 값을 공유해야 한다.
# 소스에 두지 않고 Secret 으로 주입하며, 실제 환경에서는 apply 전에 새로 생성한다.
#   kubectl -n edu-platform create secret generic edu-auth-jwt \
#     --from-literal=EDU_JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=EDU_SEED_PASSWORD="$(openssl rand -base64 12)"
#
# 같은 Secret 을 platform/backend.yaml 의 EDU_JWT_SECRET 도 참조한다.
apiVersion: v1
kind: Secret
metadata:
  name: edu-auth-jwt
  namespace: edu-platform
type: Opaque
stringData:
  EDU_JWT_SECRET: change-me-in-real-env-at-least-32-bytes-long
  EDU_SEED_PASSWORD: change-me-in-real-env
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: edu-platform
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: registry.edu.internal/edu-msa-auth-service:latest
          env:
            - name: AUTH_DB_URL
              value: jdbc:postgresql://auth-db.edu-platform.svc.cluster.local:5432/eduauth
            - name: AUTH_DB_USER
              valueFrom:
                secretKeyRef: { name: edu-auth-db, key: POSTGRES_USER }
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: edu-auth-db, key: POSTGRES_PASSWORD }
            - name: PORT
              value: "8080"
            - name: CORS_ORIGINS
              value: https://edu.internal
            - name: EDU_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: edu-auth-jwt, key: EDU_JWT_SECRET }
            # HTTPS 로 서비스하므로 Refresh 쿠키에 Secure 를 켠다.
            - name: EDU_COOKIE_SECURE
              value: "true"
            - name: EDU_COOKIE_SAMESITE
              value: "Lax"
            - name: EDU_SEED
              value: "true"
            - name: EDU_SEED_PASSWORD
              valueFrom:
                secretKeyRef: { name: edu-auth-jwt, key: EDU_SEED_PASSWORD }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /api/auth/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/auth/health, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "1", memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: edu-platform
spec:
  selector:
    app: auth-service
  ports:
    - port: 80
      targetPort: 8080
