# 인증 마이크로서비스.
#
# JWT 서명 키는 auth-service(발급)와 backend(검증)가 같은 값을 공유해야 한다.
# Secret(edu-auth-jwt: EDU_JWT_SECRET ≥32B, EDU_SEED_PASSWORD)은 이 파일에 두지 않는다.
#  - 로컬/리허설: bootstrap.sh 가 무작위 값으로 자동 생성한다.
#  - 운영: Sealed Secrets 로 반영한다 — deploy/k8s/secrets/README.md 참고.
# 같은 Secret 을 platform/backend.yaml 의 EDU_JWT_SECRET 도 참조한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: edu-platform
  labels:
    app: auth-service
spec:
  replicas: 2
  # 무중단 롤링: 항상 현재 수 유지 후 1개씩 교체 (테넌트 service-template 과 동일 정책)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      # graceful shutdown 예산: preStop 5s(엔드포인트 제거 전파) + 앱 종료 대기 20s + 여유
      terminationGracePeriodSeconds: 45
      # 가용성: replica 를 노드/존에 분산(soft — 단일 노드 로컬에서도 스케줄 가능)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: auth-service }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: auth-service }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: auth-service }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: auth-service
          # 불변 태그만 사용(:latest 금지) — bootstrap.sh 가 IMAGE_TAG(기본 git-<sha>)로 치환.
          image: registry.edu.internal/edu-msa-auth-service:0.8.0
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          env:
            # HA DB(CloudNativePG, auth-db-ha.yaml) 사용: PgBouncer 풀러(edu-auth-db-pooler-rw) 경유.
            # 앱 계정 시크릿(edu-auth-db-app: username/password)은 오퍼레이터가 생성한다.
            # (개발용 단일 auth-db.yaml 사용 시 bootstrap.sh 가 host=auth-db, secret=edu-auth-db 로 치환)
            - name: AUTH_DB_URL
              value: jdbc:postgresql://edu-auth-db-pooler-rw.edu-platform.svc.cluster.local:5432/eduauth
            - name: AUTH_DB_USER
              valueFrom:
                secretKeyRef: { name: edu-auth-db-app, key: username }
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: edu-auth-db-app, key: password }
            - name: PORT
              value: "8080"
            # [부하 실측 2026-09-09] 로그인은 @Transactional 안 bcrypt(~50ms)가 커넥션을 점유해
            # 풀 20 은 로그인 400/s 폭주에서 고갈(active 20/20·pending 179·p95 12s) →
            # 40 으로 p95 62ms·pending 0. 총량: 2 replica × 40 = 80 클라이언트(풀러 경유).
            - name: DB_POOL_MAX_SIZE
              value: "40"
            # rate-limit 분산 카운터(Redis) — 다중 replica 가 같은 정책을 공유.
            # Redis 장애 시 인메모리 폴백으로 계속 제한한다(fail-open 아님).
            - name: EDU_RATELIMIT_STORE
              value: "redis"
            - name: REDIS_HOST
              value: edu-redis.edu-platform.svc.cluster.local
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: edu-redis-auth, key: password }
            - name: CORS_ORIGINS
              value: https://edu.internal
            - name: EDU_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: edu-auth-jwt, key: EDU_JWT_SECRET }
            # HTTPS 로 서비스하므로 Refresh 쿠키에 Secure 를 켠다.
            - name: EDU_COOKIE_SECURE
              value: "true"
            - name: EDU_COOKIE_SAMESITE
              value: "Lax"
            # 운영 기준 fail-safe: 시드·데모 로그인 모두 끔.
            # 로컬 kind 리허설은 bootstrap.sh 가 kind 모드에서만 "true" 로 치환한다.
            - name: EDU_SEED
              value: "false"
            - name: EDU_DEMO_LOGIN
              value: "false"
            - name: EDU_SEED_PASSWORD
              valueFrom:
                secretKeyRef: { name: edu-auth-jwt, key: EDU_SEED_PASSWORD }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /api/auth/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/auth/health, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "1", memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: edu-platform
  labels:
    app: auth-service   # ServiceMonitor selector 매칭용 (라벨 누락 결함을 staging 검증에서 수정)
spec:
  selector:
    app: auth-service
  ports:
    - name: http          # ServiceMonitor(port: http) 스크레이프용 포트명
      port: 80
      targetPort: 8080
