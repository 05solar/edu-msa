# 네임스페이스별 총량 상한(ResourceQuota)과 파드 기본/최대치(LimitRange).
# 한 서비스가 클러스터 자원을 독식하지 못하게 한다.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: edu-quota
  namespace: edu-services
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "100"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: edu-limits
  namespace: edu-services
spec:
  limits:
    - type: Container
      default: { cpu: "500m", memory: 512Mi }        # limits 미지정 시 기본값
      defaultRequest: { cpu: "100m", memory: 128Mi }  # requests 미지정 시 기본값
      max: { cpu: "2", memory: 2Gi }                  # 컨테이너당 최대
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: edu-quota
  namespace: edu-services-public
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "200"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: edu-limits
  namespace: edu-services-public
spec:
  limits:
    - type: Container
      default: { cpu: "250m", memory: 256Mi }
      defaultRequest: { cpu: "50m", memory: 64Mi }
      max: { cpu: "1", memory: 1Gi }                  # 비신뢰 워크로드는 더 타이트하게
