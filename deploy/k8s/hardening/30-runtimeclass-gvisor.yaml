# 샌드박스 런타임(gVisor). 비신뢰 워크로드(edu-services-public)는 이 RuntimeClass로 실행해
# 커널 공격면을 격리한다. 노드에 gVisor(runsc)와 containerd 핸들러가 설치되어 있어야 한다.
# 서비스 매니페스트에 runtimeClassName: gvisor 를 지정한다.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
# 대안: Kata Containers(경량 VM 격리) → handler: kata
