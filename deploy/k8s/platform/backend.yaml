apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: edu-platform
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: edu-deployer   # 서비스 배포용 권한 (rbac.yaml)
      containers:
        - name: backend
          image: registry.edu.internal/edu-msa-backend:latest
          env:
            # HA DB(CloudNativePG, postgres-ha.yaml) 사용: edu-db-rw = 현재 primary로 라우팅.
            # 앱 계정 시크릿(edu-db-app)은 오퍼레이터가 생성한다.
            # (개발용 단일 postgres.yaml 사용 시: host=postgres, secret=edu-db)
            - name: DB_URL
              value: jdbc:postgresql://edu-db-rw.edu-platform.svc.cluster.local:5432/edumsa
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: edu-db-app, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: edu-db-app, key: password }
            - name: PORT
              value: "8080"
            - name: CORS_ORIGINS
              value: https://edu.internal
            - name: EDU_SEED
              value: "true"
            - name: EDU_DEPLOY_MODE
              value: "real"
            - name: EDU_DEPLOY_NAMESPACE
              value: edu-services
            - name: EDU_DEPLOY_INGRESS_HOST
              value: edu.internal
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: edu-platform
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: 8080
