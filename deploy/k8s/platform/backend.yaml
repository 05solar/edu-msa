apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: edu-platform
  labels:
    app: backend
spec:
  replicas: 2
  # 무중단 롤링: 항상 현재 수 유지 후 1개씩 교체 (테넌트 service-template 과 동일 정책)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: edu-deployer   # 서비스 배포용 권한 (rbac.yaml)
      # 가용성: replica 를 노드/존에 분산 — 단일 노드 장애가 전체 중단이 되지 않게 한다.
      # soft(ScheduleAnyway/preferred)라 단일 노드(kind 로컬)에서도 스케줄된다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: backend }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: backend }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: backend }
                topologyKey: kubernetes.io/hostname
      # graceful shutdown 예산: preStop 5s(엔드포인트 제거 전파) + 앱 종료 대기 20s + 여유
      terminationGracePeriodSeconds: 45
      containers:
        - name: backend
          # 불변 태그만 사용(:latest 금지) — bootstrap.sh 가 IMAGE_TAG(기본 git-<sha>)로 치환하고,
          # 롤백은 이전 태그 재지정 또는 kubectl rollout undo 로 수행한다.
          image: registry.edu.internal/edu-msa-backend:0.8.0
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          env:
            # API 파드는 배포 큐 워커를 돌리지 않는다 — 큐 처리는 backend-worker.yaml(동일 이미지,
            # 큐 길이 기반 KEDA 스케일)이 전담해 HTTP 스케일 축과 분리된다.
            - name: EDU_DEPLOY_WORKER_ENABLED
              value: "false"
            # HA DB(CloudNativePG, postgres-ha.yaml) 사용: PgBouncer 풀러(edu-db-pooler-rw)를
            # 경유해 primary 로 라우팅 — 앱 replica 가 늘어도 DB 실커넥션을 풀러가 상한으로 묶는다.
            # 읽기 전용 워크로드 분리 시: edu-db-pooler-ro (replica 라우팅) 사용.
            # 앱 계정 시크릿(edu-db-app)은 오퍼레이터가 생성한다.
            # (개발용 단일 postgres.yaml 사용 시 bootstrap.sh 가 host=postgres, secret=edu-db 로 치환)
            - name: DB_URL
              value: jdbc:postgresql://edu-db-pooler-rw.edu-platform.svc.cluster.local:5432/edumsa
            # read replica 라우팅 — 카탈로그 목록/집계(캐시 미스분)가 replica(ro 풀러)로 간다.
            # 개발(단일 postgres)은 bootstrap.sh 가 값을 비워 라우팅을 끈다.
            - name: DB_RO_URL
              value: jdbc:postgresql://edu-db-pooler-ro.edu-platform.svc.cluster.local:5432/edumsa
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: edu-db-app, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: edu-db-app, key: password }
            - name: PORT
              value: "8080"
            # [부하 실측 2026-09-09] 2,000 RPS 혼합 조회에서 Hikari active ≤3(캐시 적중 91%) —
            # 풀 10 으로 재실측해도 동일 성능(p95 5ms·pending 0). HPA max 10 replica × 10 = 100
            # 클라이언트 ≤ 풀러 max_client_conn 1000(서버측은 풀러 pool_size 가 상한).
            - name: DB_POOL_MAX_SIZE
              value: "10"
            # 카탈로그 읽기 캐시(Redis) — 장애 시 DB 폴백이라 필수 의존 아님
            - name: REDIS_HOST
              value: edu-redis.edu-platform.svc.cluster.local
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: edu-redis-auth, key: password }
            - name: CORS_ORIGINS
              value: https://edu.internal
            # 운영 기준 fail-safe: 시드 끔(로컬 kind 는 bootstrap.sh 가 "true" 로 치환).
            - name: EDU_SEED
              value: "false"
            # auth-service 가 발급한 JWT 를 자체 검증하기 위한 공용 서명 키.
            # auth-service Deployment(auth/auth-service.yaml)와 동일한 Secret 을 참조한다.
            - name: EDU_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: edu-auth-jwt, key: EDU_JWT_SECRET }
            - name: EDU_DEPLOY_MODE
              value: "real"
            - name: EDU_DEPLOY_NAMESPACE
              value: edu-services
            # [P0-1] Kaniko 빌드 격리 ns — 이미지 기본값과 무관하게 매니페스트에서 강제한다
            # (platform/build.yaml 의 PSA·NetPol·Quota 가 적용되는 곳에서만 빌드 실행).
            - name: EDU_DEPLOY_BUILD_NAMESPACE
              value: edu-build
            - name: EDU_DEPLOY_INGRESS_HOST
              value: edu.internal
# Kaniko push 대상이자 테넌트 매니페스트의 이미지 접두어(노드가 pull 가능해야 함).
            # bootstrap.sh 가 REGISTRY 값으로 치환한다.
            - name: EDU_DEPLOY_REGISTRY
              value: registry.edu.internal
            # 레지스트리가 HTTP(비TLS)면 "true" (kind 로컬 레지스트리 등)
            - name: EDU_DEPLOY_KANIKO_INSECURE
              value: "false"
            # 내부 Gitea 연동(3단계): 비공개 레포 clone 자격 증명.
            # Secret(edu-gitea-token)은 bootstrap stack 이 봇 계정과 함께 생성한다(optional).
            - name: EDU_GITEA_HOST
              value: gitea.edu.internal
            # 인클러스터 수집은 Ingress 를 거치지 않고 서비스 주소로 직접 받는다
            # (kind 의 *.localhost 루프백 강제 해석 문제도 함께 회피).
            - name: EDU_GITEA_CLONE_BASE
              value: http://gitea-http.gitea.svc:3000
            - name: EDU_GITEA_USER
              valueFrom: { secretKeyRef: { name: edu-gitea-token, key: username, optional: true } }
            - name: EDU_GITEA_TOKEN
              valueFrom: { secretKeyRef: { name: edu-gitea-token, key: token, optional: true } }
            # push webhook 서명 검증 시크릿(4단계) — bootstrap 이 Gitea default webhook 과 함께 생성
            - name: EDU_GITEA_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: edu-gitea-webhook, key: secret, optional: true } }
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: edu-platform
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: 8080
