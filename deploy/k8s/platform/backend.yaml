apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: edu-platform
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: edu-deployer   # 서비스 배포용 권한 (rbac.yaml)
      containers:
        - name: backend
          image: registry.edu.internal/edu-msa-backend:latest
          env:
            # HA DB(CloudNativePG, postgres-ha.yaml) 사용: edu-db-rw = 현재 primary로 라우팅.
            # 앱 계정 시크릿(edu-db-app)은 오퍼레이터가 생성한다.
            # (개발용 단일 postgres.yaml 사용 시: host=postgres, secret=edu-db)
            - name: DB_URL
              value: jdbc:postgresql://edu-db-rw.edu-platform.svc.cluster.local:5432/edumsa
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: edu-db-app, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: edu-db-app, key: password }
            - name: PORT
              value: "8080"
            - name: CORS_ORIGINS
              value: https://edu.internal
            - name: EDU_SEED
              value: "true"
            # auth-service 가 발급한 JWT 를 자체 검증하기 위한 공용 서명 키.
            # auth-service Deployment(auth/auth-service.yaml)와 동일한 Secret 을 참조한다.
            - name: EDU_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: edu-auth-jwt, key: EDU_JWT_SECRET }
            - name: EDU_DEPLOY_MODE
              value: "real"
            - name: EDU_DEPLOY_NAMESPACE
              value: edu-services
            - name: EDU_DEPLOY_INGRESS_HOST
              value: edu.internal
# Kaniko push 대상이자 테넌트 매니페스트의 이미지 접두어(노드가 pull 가능해야 함).
            # bootstrap.sh 가 REGISTRY 값으로 치환한다.
            - name: EDU_DEPLOY_REGISTRY
              value: registry.edu.internal
            # 레지스트리가 HTTP(비TLS)면 "true" (kind 로컬 레지스트리 등)
            - name: EDU_DEPLOY_KANIKO_INSECURE
              value: "false"
            # 내부 Gitea 연동(3단계): 비공개 레포 clone 자격 증명.
            # Secret(edu-gitea-token)은 bootstrap stack 이 봇 계정과 함께 생성한다(optional).
            - name: EDU_GITEA_HOST
              value: gitea.edu.internal
            # 인클러스터 수집은 Ingress 를 거치지 않고 서비스 주소로 직접 받는다
            # (kind 의 *.localhost 루프백 강제 해석 문제도 함께 회피).
            - name: EDU_GITEA_CLONE_BASE
              value: http://gitea-http.gitea.svc:3000
            - name: EDU_GITEA_USER
              valueFrom: { secretKeyRef: { name: edu-gitea-token, key: username, optional: true } }
            - name: EDU_GITEA_TOKEN
              valueFrom: { secretKeyRef: { name: edu-gitea-token, key: token, optional: true } }
            # push webhook 서명 검증 시크릿(4단계) — bootstrap 이 Gitea default webhook 과 함께 생성
            - name: EDU_GITEA_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: edu-gitea-webhook, key: secret, optional: true } }
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: edu-platform
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: 8080
