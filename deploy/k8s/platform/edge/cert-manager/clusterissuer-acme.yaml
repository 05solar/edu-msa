# ACME(Let's Encrypt) 발급자 — 공인 도메인 실서버용.
# bootstrap.sh 가 server 모드 + ACME_EMAIL 설정 시 ${ACME_EMAIL} 을 치환해 적용한다.
#
# 이름을 edu-ca 로 유지하는 이유: 모든 Ingress(플랫폼·Gitea·테넌트 템플릿 — backend 이미지에
# 포함된 deploy-templates/service-template.yaml 까지)가 cert-manager.io/cluster-issuer: edu-ca
# 를 참조한다. 같은 이름의 발급자를 ACME 로 교체하면 어디도 고치지 않고 전부 공인 인증서로
# 전환된다(PRODUCTION.md §3 의 설계 의도). clusterissuers.yaml(내부 CA 체인)보다 나중에
# 적용해 동일 이름을 덮어쓴다.
#
# 전제: HTTP-01 검증이 80 포트로 들어오므로 80/443 이 인터넷에 개방되고
# DOMAIN·*.DOMAIN DNS 가 ingress-nginx(L4 LB)를 가리켜야 한다.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: edu-ca
spec:
  acme:
    email: ${ACME_EMAIL}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: edu-acme-account-key   # ACME 계정 키(cert-manager ns에 자동 생성)
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
# 스테이징 발급자(선택) — 발급 경로 검증용. 운영 발급자는 요율 제한(도메인당 주 50건)이
# 있으므로, 반복 테스트는 Ingress 주석을 letsencrypt-staging 으로 잠시 바꿔 수행한다
# (스테이징 인증서는 브라우저가 신뢰하지 않음 — 발급 성공 여부만 확인).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    email: ${ACME_EMAIL}
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: edu-acme-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
