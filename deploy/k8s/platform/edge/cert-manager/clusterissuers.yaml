# cert-manager 발급자 체인.
# 실서버에서는 selfSigned 대신 ACME(Let's Encrypt) ClusterIssuer로 교체하면 공인 인증서 자동 발급.
# 내부망/오프라인은 아래 self-signed 루트 CA 방식 사용.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
# 자체 루트 CA (한 번 발급, 오래 유지). 내부 서비스 인증서를 이 CA로 서명.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: edu-root-ca
  namespace: cert-manager        # CA ClusterIssuer가 참조하는 시크릿 위치
spec:
  isCA: true
  commonName: edu-msa-root-ca
  secretName: edu-root-ca
  duration: 87600h               # 10년
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
# 서비스용 CA 발급자. Ingress에 cert-manager.io/cluster-issuer: edu-ca 로 참조.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: edu-ca
spec:
  ca:
    secretName: edu-root-ca
