apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: edu-platform
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # 정적 빌드(dist)를 nginx로 서빙하는 이미지 (frontend/Dockerfile 로 빌드)
          image: registry.edu.internal/edu-msa-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: edu-platform
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
