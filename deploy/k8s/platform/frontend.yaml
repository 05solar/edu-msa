apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: edu-platform
  labels:
    app: frontend
spec:
  replicas: 2
  # 무중단 롤링: 항상 현재 수 유지 후 1개씩 교체 (테넌트 service-template 과 동일 정책)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # 가용성: replica 를 노드/존에 분산(soft — 단일 노드 로컬에서도 스케줄 가능)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: frontend }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: frontend }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: frontend }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: frontend
          # 정적 빌드(dist)를 nginx로 서빙하는 이미지 (frontend/Dockerfile 로 빌드)
          image: registry.edu.internal/edu-msa-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: edu-platform
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
