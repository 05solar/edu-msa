apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edu-platform
  namespace: edu-platform
  # rewrite-target 은 두지 않는다.
  # 캡처 그룹 없는 경로에 rewrite-target: / 를 걸면 /api/auth/login 같은 요청이
  # 모두 / 로 재작성되어 백엔드에 도달하지 못한다. 경로를 그대로 전달해야 한다.
  annotations:
    # 같은 호스트의 테넌트 Ingress 가 TLS 를 붙이면 ingress-nginx 가 host 전체에
    # https 308 을 강제해 HTTP 경유(전면 Nginx 종료·로컬 kind) 요청이 막힌다.
    # TLS 는 엣지에서 종료하므로 ingress 단 리다이렉트는 끈다.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: edu.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
# 인증 API 전용 Ingress — /api 보다 구체적인 경로라 우선 매칭되며,
# 로그인/갱신 엔드포인트에만 엣지(클라이언트 IP 기준) rate limit 을 건다.
# (애플리케이션 계층의 계정/IP 기준 제한(LoginGuard)과 이중 방어)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edu-platform-auth
  namespace: edu-platform
  annotations:
    # 클라이언트 IP 당 초당 5요청(버스트는 컨트롤러 기본 배수 적용) · 동시 연결 10
    nginx.ingress.kubernetes.io/limit-rps: "5"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: edu.internal
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 80
