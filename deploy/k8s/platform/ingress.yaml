apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edu-platform
  namespace: edu-platform
  # rewrite-target 은 두지 않는다.
  # 캡처 그룹 없는 경로에 rewrite-target: / 를 걸면 /api/auth/login 같은 요청이
  # 모두 / 로 재작성되어 백엔드에 도달하지 못한다. 경로를 그대로 전달해야 한다.
  annotations:
    # 같은 호스트의 테넌트 Ingress 가 TLS 를 붙이면 ingress-nginx 가 host 전체에
    # https 308 을 강제해 HTTP 경유(전면 Nginx 종료·로컬 kind) 요청이 막힌다.
    # TLS 는 엣지에서 종료하므로 ingress 단 리다이렉트는 끈다.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: edu.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
# 인증 API 전용 Ingress — /api 보다 구체적인 경로라 우선 매칭되며,
# 로그인/갱신 엔드포인트에만 엣지(클라이언트 IP 기준) rate limit 을 건다.
# (애플리케이션 계층의 계정/IP 기준 제한(LoginGuard)과 이중 방어)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edu-platform-auth
  namespace: edu-platform
  annotations:
    # NAT 대비 한도 (production readiness review 실측 근거):
    # 학교·기관은 공유 공인 IP(NAT) 뒤 수백 명이 동시 로그인한다 — limit-rps 5 는
    # staging 실측에서 단일 IP 30/s 중 25/s 를 차단했다(정상 사용자 오차단).
    # 20 rps/IP × burst 5배(100 요청 흡수)로 상향 — 인증 CPU 보호(bcrypt ~50ms/건,
    # 실측 코어당 ~21건/s)는 유지하면서 기관 단위 출근 버스트를 통과시킨다.
    # brute-force 방어의 본체는 앱 계층 LoginGuard(계정 5회 실패 잠금 + IP 합산 실패
    # 한도)이며 엣지 한도는 CPU-DoS 방호가 목적이다.
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    # keep-alive 다중 사용자 NAT 에서 동시 연결 10 은 병목 — 100 으로 상향.
    nginx.ingress.kubernetes.io/limit-connections: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: edu.internal
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 80
