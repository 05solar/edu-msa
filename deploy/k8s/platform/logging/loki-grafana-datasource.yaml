# kube-prometheus-stack Grafana 사이드카가 자동 로드하는 Loki 데이터소스.
# 라벨 grafana_datasource=1 이면 Grafana가 자동 인식한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.logging.svc.cluster.local:3100
        isDefault: false
        jsonData:
          # 로그 라인의 trace_id → Tempo 트레이스로 이동(앱이 trace_id를 로그에 남길 때)
          derivedFields:
            - name: TraceID
              matcherRegex: "trace_id=(\\w+)"
              url: "$${__value.raw}"   # provisioning 변수 확장을 피하려 $$ 이스케이프
              datasourceUid: tempo
