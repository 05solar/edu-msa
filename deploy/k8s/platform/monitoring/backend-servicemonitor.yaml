# 플랫폼 백엔드 메트릭 스크레이프 (kube-prometheus-stack).
# 백엔드는 /actuator/prometheus 로 JVM/HTTP/Hikari 등 메트릭을 노출한다.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  namespace: edu-platform
  labels:
    release: kps        # kube-prometheus-stack Prometheus 가 이 라벨로 ServiceMonitor 를 선택
spec:
  selector:
    # API(backend)와 배포 워커(backend-worker) Service 모두 스크레이프 —
    # 워커의 큐 메트릭(edu_deploy_queue_depth 등)이 KEDA 스케일 기준이 된다.
    matchExpressions:
      - { key: app, operator: In, values: [backend, backend-worker] }
  endpoints:
    - port: http        # Service 포트 이름
      path: /actuator/prometheus
      interval: 30s
