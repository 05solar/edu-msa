# 접속정보 Secret(edu-db: POSTGRES_DB/USER/PASSWORD)은 이 파일에 두지 않는다.
#  - 로컬/리허설: bootstrap.sh 가 무작위 비밀번호로 자동 생성한다.
#  - 운영: Sealed Secrets 로 반영한다 — deploy/k8s/secrets/README.md 참고.
#    (server 모드 bootstrap 은 Secret 이 없으면 안내와 함께 중단한다 — placeholder 반입 차단)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edu-pgdata
  namespace: edu-platform
spec:
  # 운영: 노드 종속 스토리지(local-path 등) 금지 — 네트워크 스토리지 클래스를 지정해야
  # 노드 장애/드레인 시 파드가 다른 노드로 재스케줄될 수 있다.
  # bootstrap.sh 가 STORAGE_CLASS 설정 시 아래 마커를 실제 값으로 치환한다(미설정 시 클러스터 기본).
  #EDU_STORAGE_CLASS
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: edu-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: edu-db
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "edumsa", "-d", "edumsa"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: edu-pgdata
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: edu-platform
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
