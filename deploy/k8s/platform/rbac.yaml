# 플랫폼 백엔드가 edu-services 네임스페이스에 서비스를 배포할 수 있는 최소 권한
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edu-deployer
  namespace: edu-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: edu-deployer
  namespace: edu-services
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edu-deployer
  namespace: edu-services
subjects:
  - kind: ServiceAccount
    name: edu-deployer
    namespace: edu-platform
roleRef:
  kind: Role
  name: edu-deployer
  apiGroup: rbac.authorization.k8s.io
