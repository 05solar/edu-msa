# 바이브 코더가 올린 서비스 1개당 렌더링되는 매니페스트 템플릿.
# 플랫폼 백엔드(ManifestRenderer)가 service.yaml 값을 채워 넣는다. (backend/.../deploy-templates/service-template.yaml 와 동일)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{SLUG}}
  namespace: {{NAMESPACE}}
  labels:
    app: {{SLUG}}
    edu.category: "{{CATEGORY}}"
    app.kubernetes.io/managed-by: edu-msa
  annotations:
    edu.msa/display-name: "{{NAME}}"
spec:
  replicas: {{REPLICAS}}
  # 무중단 롤링 업데이트: 항상 최소 현재 수 유지(0 down), 1개씩 초과 기동 후 교체
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{SLUG}}
  template:
    metadata:
      labels:
        app: {{SLUG}}
    spec:
      automountServiceAccountToken: false
      # 가용성: 같은 앱 파드를 노드/AZ에 분산(단일 노드에서도 스케줄 가능하도록 soft)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: {{SLUG}} }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: {{SLUG}} }
                topologyKey: kubernetes.io/hostname
      # 비신뢰(공개) 서비스는 아래 주석 해제로 샌드박스 런타임 사용 (edu-services-public)
      # runtimeClassName: gvisor
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{SLUG}}
          image: {{IMAGE}}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PORT
              value: "{{PORT}}"
          ports:
            - containerPort: {{PORT}}
          readinessProbe:
            httpGet: { path: {{HEALTH}}, port: {{PORT}} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: {{HEALTH}}, port: {{PORT}} }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: "{{CPU}}", memory: "{{MEMORY}}" }
            limits: { cpu: "{{CPU_LIMIT}}", memory: "{{MEMORY_LIMIT}}"{{GPU_LIMIT}} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{SLUG}}
  namespace: {{NAMESPACE}}
  labels:
    app: {{SLUG}}
spec:
  selector:
    app: {{SLUG}}
  ports:
    - port: 80
      targetPort: {{PORT}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{SLUG}}
  namespace: {{NAMESPACE}}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    # 엣지 보안: 서비스별 rate-limit + WAF(ModSecurity/OWASP CRS)
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
    # 자동 TLS 인증서(cert-manager). 실서버는 edu-ca 를 ACME(Let's Encrypt) 발급자로 교체.
    cert-manager.io/cluster-issuer: edu-ca
    # TLS 를 앞단(전면 Nginx 또는 별도 엣지)에서 종료하는 구성에서 강제 https 308 이
    # 플랫폼 공용 호스트 전체를 막지 않도록 ingress 단 리다이렉트는 끈다.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [ {{HOST}} ]
      secretName: {{SLUG}}-tls
  rules:
    - host: {{HOST}}
      http:
        paths:
          - path: /svc/{{SLUG}}
            pathType: Prefix
            backend:
              service:
                name: {{SLUG}}
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{SLUG}}
  namespace: {{NAMESPACE}}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{SLUG}} }
  minReplicas: {{REPLICAS}}
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
# 중단 예산: 자발적 중단(노드 드레인/업그레이드) 시 동시에 1개까지만 내려가도록 보장
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{SLUG}}
  namespace: {{NAMESPACE}}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: {{SLUG}}
