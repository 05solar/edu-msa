<!doctype html><html lang=ko><head><meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1"><title>문서 이미지 OCR 추출기</title>
<style>
:root{--line:#e2e8f0;--ink:#1e293b;--mut:#64748b;--blue:#2563eb;--bg:#f8fafc}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:16px 24px}header h1{font-size:20px;margin:0}header p{margin:4px 0 0;color:var(--mut);font-size:13px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.panel h2{font-size:14px;margin:0 0 10px}
label{font-size:12px;color:var(--mut);display:block;margin:10px 0 4px}
select,textarea{width:100%;font:14px system-ui,'Malgun Gothic',sans-serif;padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:#fff}
textarea{min-height:320px;resize:vertical;line-height:1.6}
button{font:inherit;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:#94a3b8;cursor:pointer}
.drop.drag{border-color:var(--blue);background:#eff6ff;color:var(--blue)}
#preview{max-width:100%;max-height:340px;border-radius:8px;margin-top:12px;display:none}
.stats{display:flex;gap:16px;color:#64748b;font-size:13px;margin-bottom:8px}.stats b{color:#1e293b}
.spinner{display:none;color:var(--blue);font-size:13px;margin-top:8px}
</style></head><body>
<header><h1>문서 이미지 OCR 추출기</h1><p>스캔 문서·사진을 올리면 한글/영문 OCR로 글자를 인식해 편집 가능한 텍스트로 추출합니다. (개인 단발 사용 도구)</p></header>
<div class="wrap"><div class="grid2">
  <div class="panel">
    <h2>이미지 업로드</h2>
    <div class="drop" id="drop" onclick="document.getElementById('file').click()">
      이미지를 여기로 끌어다 놓거나 클릭해서 선택하세요.<br><span style="font-size:12px">PNG · JPG · TIFF · BMP</span>
    </div>
    <input id="file" type="file" accept="image/*" style="display:none" onchange="pick(event)">
    <img id="preview">
    <label>인식 언어</label>
    <select id="lang"><option value="kor+eng">한글 + 영문</option><option value="kor">한글</option><option value="eng">영문</option></select>
    <div class="toolbar"><button class="btn-primary" onclick="run()">텍스트 추출</button></div>
    <div class="spinner" id="spin">인식 중입니다… 잠시만 기다려 주세요.</div>
  </div>
  <div class="panel">
    <h2>추출 결과</h2>
    <div class="stats" id="stats"></div>
    <textarea id="out" placeholder="추출된 텍스트가 여기에 표시됩니다. 직접 수정할 수 있습니다."></textarea>
    <div class="toolbar"><button onclick="copyText()">복사</button><button onclick="download()">텍스트(.txt) 다운로드</button></div>
  </div>
</div></div>
<script>
let currentFile=null;
const drop=document.getElementById('drop');
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag');}));
drop.addEventListener('drop',e=>{if(e.dataTransfer.files[0])setFile(e.dataTransfer.files[0]);});
function pick(e){if(e.target.files[0])setFile(e.target.files[0]);}
function setFile(f){
  if(!f.type.startsWith('image/')){alert('이미지 파일만 올릴 수 있습니다.');return;}
  currentFile=f;
  const img=document.getElementById('preview');img.src=URL.createObjectURL(f);img.style.display='block';
  drop.innerHTML=f.name;
}
function run(){
  if(!currentFile){alert('이미지를 먼저 선택하세요.');return;}
  const fd=new FormData();fd.append('file',currentFile);fd.append('lang',document.getElementById('lang').value);
  document.getElementById('spin').style.display='block';
  fetch('/api/ocr',{method:'POST',body:fd}).then(r=>r.json().then(d=>({ok:r.ok,d}))).then(x=>{
    document.getElementById('spin').style.display='none';
    if(!x.ok){alert('오류: '+(x.d.error?x.d.error.message:''));return;}
    document.getElementById('out').value=x.d.text;
    document.getElementById('stats').innerHTML='글자 <b>'+x.d.chars+'</b> · 단어 <b>'+x.d.words+'</b> · 줄 <b>'+x.d.lines+'</b>';
  }).catch(()=>{document.getElementById('spin').style.display='none';alert('요청 실패');});
}
function copyText(){const t=document.getElementById('out');t.select();navigator.clipboard&&navigator.clipboard.writeText(t.value);}
function download(){const blob=new Blob([document.getElementById('out').value],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='추출텍스트.txt';a.click();}
</script></body></html>
