<!doctype html><html lang=ko><head><meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1"><title>국내출장 여비 계산기</title>
<style>
:root{--line:#e2e8f0;--ink:#1e293b;--mut:#64748b;--blue:#2563eb;--bg:#f8fafc}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:16px 24px}header h1{font-size:20px;margin:0}header p{margin:4px 0 0;color:var(--mut);font-size:13px}
.wrap{max-width:960px;margin:0 auto;padding:20px 24px}
.grid2{display:grid;grid-template-columns:400px 1fr;gap:18px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.panel h2{font-size:14px;margin:0 0 12px}
label{font-size:12px;color:var(--mut);display:block;margin:10px 0 4px}
input,select{width:100%;font:14px system-ui,'Malgun Gothic',sans-serif;padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:#fff}
.row{display:flex;gap:8px}.row>div{flex:1}
.chk{display:flex;align-items:center;gap:6px;margin-top:12px}.chk input{width:auto}
button{font:inherit;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-size:12px}
td.amt,th.amt{text-align:right;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:12px;border-top:2px solid var(--ink)}
.total b{font-size:26px}
.empty-hint{color:#94a3b8;text-align:center;padding:36px}
.note{font-size:12px;color:#94a3b8;margin-top:10px;line-height:1.6}
@media print{header,.panel.input,.toolbar{display:none!important}.grid2{grid-template-columns:1fr}}
</style></head><body>
<header><h1>국내출장 여비 계산기</h1><p>출장 조건을 입력하면 일비·식비·숙박비·운임을 규정(표준 예시)대로 계산해 내역서를 만들어 드립니다. (개인 단발 사용 도구)</p></header>
<div class="wrap"><div class="grid2">
  <div class="panel input">
    <h2>출장 조건</h2>
    <label>출장 구분</label>
    <select id="tripType" onchange="toggle()"><option value="outcity">관외 출장</option><option value="incity">관내 출장</option></select>
    <div id="incityBox" style="display:none">
      <label>출장 시간</label>
      <select id="hours"><option value="4">4시간 이상</option><option value="0">4시간 미만</option></select>
    </div>
    <div id="outBox">
      <div class="row"><div><label>시작일</label><input id="startDate" type="date"></div><div><label>종료일</label><input id="endDate" type="date"></div></div>
      <label>교통수단</label>
      <select id="transport" onchange="toggle()"><option value="car">자가용</option><option value="public">대중교통</option><option value="official">관용차</option></select>
      <div id="carBox"><label>편도/왕복 총 거리(km)</label><input id="distanceKm" type="number" value="0" min="0"></div>
      <div id="pubBox" style="display:none"><label>대중교통 운임 실비(원)</label><input id="fareActual" type="number" value="0" min="0"></div>
      <label>숙박 지역(상한 기준)</label>
      <select id="region"><option value="other">그 밖의 지역(7만)</option><option value="metro">광역시·세종·제주(8만)</option><option value="seoul">서울(10만)</option></select>
      <label>숙박 실비 총액(원, 미입력 시 상한 적용)</label>
      <input id="lodgingActual" type="number" value="0" min="0">
      <div class="chk"><input id="freeLodging" type="checkbox"><label for="freeLodging" style="margin:0">무료숙박(관사·연수원 등) — 숙박비 0</label></div>
    </div>
    <div class="toolbar"><button class="btn-primary" onclick="calc()">여비 계산</button><button onclick="loadSample()">예시</button></div>
    <div class="note">표준 예시값: 일비/식비 각 25,000원/일, 자가용 262원/km, 숙박 상한 서울10만·광역시8만·기타7만. 기관 규정에 맞게 확인하세요.</div>
  </div>
  <div class="panel">
    <h2>여비 내역서</h2>
    <div id="result"><div class="empty-hint">왼쪽에 출장 조건을 입력하고 [여비 계산]을 누르세요.</div></div>
    <div class="toolbar" id="tools" style="display:none"><button onclick="window.print()">인쇄</button><button onclick="csv()">CSV 다운로드</button></div>
  </div>
</div></div>
<script>
let lastItems=null,lastTotal=0;
function toggle(){
  const t=document.getElementById('tripType').value;
  document.getElementById('incityBox').style.display=t==='incity'?'block':'none';
  document.getElementById('outBox').style.display=t==='incity'?'none':'block';
  const tr=document.getElementById('transport').value;
  document.getElementById('carBox').style.display=tr==='car'?'block':'none';
  document.getElementById('pubBox').style.display=tr==='public'?'block':'none';
}
function num(id){return parseInt(document.getElementById(id).value||'0',10);}
function calc(){
  const body={tripType:document.getElementById('tripType').value,
    startDate:document.getElementById('startDate').value,endDate:document.getElementById('endDate').value,
    region:document.getElementById('region').value,transport:document.getElementById('transport').value,
    distanceKm:num('distanceKm'),fareActual:num('fareActual'),lodgingActual:num('lodgingActual'),
    freeLodging:document.getElementById('freeLodging').checked,hours:num('hours')};
  fetch('/api/calc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>r.json().then(d=>({ok:r.ok,d}))).then(x=>{
      if(!x.ok){alert('오류: '+(x.d.error?x.d.error.message:''));return;}
      render(x.d);
    });
}
function won(n){return (n||0).toLocaleString('ko')+'원';}
function render(d){
  lastItems=d.items;lastTotal=d.total;
  let h='<table><thead><tr><th>항목</th><th>산출 내역</th><th class=amt>금액</th></tr></thead><tbody>';
  for(const it of d.items)h+='<tr><td>'+esc(it.label)+'</td><td style="color:#64748b">'+esc(it.detail)+'</td><td class=amt>'+won(it.amount)+'</td></tr>';
  h+='</tbody></table><div class="total"><span>합계</span><b>'+won(d.total)+'</b></div>';
  if(d.meta&&d.meta.days)h+='<div class="note">출장 '+d.meta.days+'일 ('+d.meta.nights+'박) 기준</div>';
  document.getElementById('result').innerHTML=h;
  document.getElementById('tools').style.display='flex';
}
function csv(){
  if(!lastItems)return;
  let rows=[['항목','산출내역','금액']];
  for(const it of lastItems)rows.push([it.label,it.detail,it.amount]);
  rows.push(['합계','',lastTotal]);
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='여비내역서.csv';a.click();
}
function esc(s){return (''+s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function loadSample(){
  document.getElementById('tripType').value='outcity';
  const t=new Date();const s=t.toISOString().slice(0,10);const e=new Date(t.getTime()+86400000).toISOString().slice(0,10);
  document.getElementById('startDate').value=s;document.getElementById('endDate').value=e;
  document.getElementById('transport').value='car';document.getElementById('distanceKm').value='120';
  document.getElementById('region').value='metro';document.getElementById('lodgingActual').value='0';
  toggle();
}
toggle();
</script></body></html>
