server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA 라우팅
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API 프록시 → 플랫폼 백엔드 서비스
  location /api/ {
    proxy_pass http://backend.edu-platform.svc.cluster.local:80/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
