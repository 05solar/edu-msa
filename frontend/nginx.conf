# 정적 서빙 + API 프록시. CDN 을 앞단에 둘 수 있도록 Cache-Control 을 자산 종류별로 나눈다:
#   - /assets/* : vite 가 파일명에 내용 해시를 넣으므로(index-<hash>.js) 1년 immutable —
#                 CDN·브라우저가 영구 캐시해도 배포 시 파일명이 바뀌어 안전하다.
#   - HTML(index.html) : no-cache — 항상 재검증해 새 배포의 해시 자산 목록을 즉시 반영.
#                        (CDN 은 이 헤더를 존중해 원본 재검증 후 서빙)
#   - 기타 정적(favicon/og/guides) : 1일 캐시(파일명 해시 없음 → 장기 캐시 금지).
# 압축: gzip(코어 모듈). brotli 는 nginx:alpine 에 모듈이 없어 미적용 —
#       필요 시 ngx_brotli 포함 이미지로 교체하거나 CDN 엣지 압축을 사용한다.

# 프록시 응답도 압축
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_types text/css application/javascript application/json image/svg+xml
           text/plain text/markdown application/xml;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 해시 자산 — 1년 immutable (CDN/브라우저 영구 캐시)
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # 파일명 해시가 없는 정적 파일 — 1일 캐시
  location ~* \.(svg|png|ico|jpg|jpeg|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # 다운로드 가이드(md/html) — 1시간
  location /guides/ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # SPA 라우팅 — HTML 은 항상 재검증(no-cache: 저장은 허용, 사용 전 재검증)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # 인증 API 프록시 → auth-service
  # nginx 는 가장 긴 prefix 를 우선 매칭하므로 /api/auth/ 가 /api/ 보다 먼저 잡힌다.
  # (배포 환경에서는 Ingress 가 먼저 분기하지만, 프론트엔드로 직접 들어온 요청도 처리한다)
  location /api/auth/ {
    proxy_pass http://auth-service.edu-platform.svc.cluster.local:80/api/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # API 프록시 → 플랫폼 백엔드 서비스 (동적 응답 — 캐시 헤더 없음, CDN 은 API 경로를 bypass)
  location /api/ {
    proxy_pass http://backend.edu-platform.svc.cluster.local:80/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
