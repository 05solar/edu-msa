server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA 라우팅
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 인증 API 프록시 → auth-service
  # nginx 는 가장 긴 prefix 를 우선 매칭하므로 /api/auth/ 가 /api/ 보다 먼저 잡힌다.
  # (배포 환경에서는 Ingress 가 먼저 분기하지만, 프론트엔드로 직접 들어온 요청도 처리한다)
  location /api/auth/ {
    proxy_pass http://auth-service.edu-platform.svc.cluster.local:80/api/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # API 프록시 → 플랫폼 백엔드 서비스
  location /api/ {
    proxy_pass http://backend.edu-platform.svc.cluster.local:80/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
